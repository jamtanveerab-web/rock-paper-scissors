<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissor</title>
</head>
<body>
    <div class="game">
    <h1 class="heading">Rock Paper Scissor</h1>
    </div>
    <div class="allchoices">
        <div class="choice" id="rock">
            <img src="rock.png">
            <p class="rocki"><b><i>Rock</i></b></p>
        </div>
        <div class="choice" id="paper">
            <img src="paper.png">
            <p class="paperi"><b>Paper</b></p>
        </div>
        <div class="choice" id="scissor">
            <img src="scissor.jpg">
            <p class="scissori"><b>Scissor</b></p>
        </div>
    </div>
    <div class="score-container" id="user-score">
        <div class="score">
            <p class="your-scores">0</p>
            <p class="yourname">you</p>
        </div>
            <div class="score" id="comp-score">
            <p class="comp-scores">0</p>
            <p>Computer</p>
        </div>
    </div>
    <div class="msg-container">
        <p class="msg">Pick your move</p>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
